    <script>
        
        var cabecalhoIcone = document.getElementById('rwg-cabecalho-mobile-icone');
        var cabecalhoConteudo = document.getElementById('rwg-cabecalho-mobile-navegacao');
        var cabecalhoLogo = document.getElementById("rwg-cabecalho-mobile-logo-img");
        var cabecalhoLogoGeral = document.getElementsByClassName("rwg-cabecalho-logo")[0];
        var cabecalhoStatus = false;
            
        function cabecalhoMobile(){
        
            if(cabecalhoStatus == false){ // mostrar navegacao

                cabecalhoStatus = true;
                cabecalhoIcone.getElementsByTagName("i")[0].setAttribute("class","bx bx-x");
                cabecalhoIcone.setAttribute("style", "color: var(--cor-azul-escuro); position: fixed; right: 30px;");
                cabecalhoConteudo.setAttribute("style", "transform: translateX(0vw); opacity: 1;");
                cabecalhoLogoGeral.setAttribute("style", "position: fixed;");

                document.querySelector('body').setAttribute("class", "stop-scrolling");


                cabecalhoLogo.setAttribute("style", "position: fixed;top: 34px;");
    
                setTimeout(function delay() {
                    cabecalhoLogo.setAttribute("style", "filter: invert(8%) sepia(32%) saturate(2155%) hue-rotate(207deg) brightness(88%) contrast(107%); position: fixed;top: 34px;");
                }, 200);

    
            }else{ // fechar navegacao
    
                cabecalhoStatus = false;
                cabecalhoIcone.getElementsByTagName("i")[0].setAttribute("class","bx bx-menu");
                cabecalhoIcone.setAttribute("style", "color: var(--cor-branco)");
    
                cabecalhoConteudo.setAttribute("style", "transform: translateX(100vw); opacity: 1;");
                cabecalhoLogo.setAttribute("style", "filter: brightness(0) invert(1);");
                cabecalhoLogoGeral.setAttribute("style", "");

                document.querySelector('body').setAttribute("class", "");
    
                setTimeout(function delay() {
                    cabecalhoConteudo.setAttribute("style", "transform: translateX(100vw); opacity: 0;");
                }, 350);
    
    
            }
        
        
        };
        
        cabecalhoRestricao();
        
        function cabecalhoRestricao(){

            var restricao = "off";
            
            if(restricao == "off"){

                document.getElementById("rwg-cabecalho-navegacao").getElementsByClassName("rwg-btn-branco-cabecalho")[0].setAttribute("style","display:none");
                document.getElementById("rwg-cabecalho-mobile-navegacao").getElementsByClassName("rwg-btn-preto-cabecalho-mobile")[0].setAttribute("style","display:none");
                
            }
            
        }
        
    </script>

    <!-- Intro (SplashScreen) -->
<section class="rwg-secao secao-intro">
    <div class="intro">
        
        <div class="logo-header">
                    
            <img class="logo" src="/uploads/logoPequena.webp">
                    
        </div>
            
    </div>
    
    <style>

        .intro{
        
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            
            background-color: var(--cor-azul-escuro);
            
            transition: 1s;
        
        
        }
        
        .logo-header{
            
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .logo{
            
            position: relative;
            bottom: -60px;
            opacity: 0;
            
            width: 150px;
            
            filter: brightness(0) invert(1);
            
        }
        
        .logo.active{
            
            bottom: 0;
            opacity: 1;
            transition: ease-in-out 0.5s;
            
        }
        
        .logo.fade{
            
            bottom: 180px;
            opacity: 0;
            transition: ease-in-out 0.5s;
            
        }
        
        @media (max-width: 767px) {
            
            .logo{
        
                width: 100px;
            
            } 
            
            
        }
    
    </style>

    <script>
    
        var intro = document.querySelector('.intro');
        var logo = document.querySelector('.logo');
        var pag = document.getElementById("pagina");
        var body = document.querySelector('body');

        window.addEventListener('DOMContentLoaded', ()=>{
        
            setTimeout(()=>{
                        
                setTimeout(()=>{
                    logo.classList.add('active');
                },0);
        
            })	
        
        });

        window.onload = function loaded(){
            
            setTimeout(()=>{
                
                setTimeout(()=>{
                    pag.style.opacity = '1';
                },1000);
                
                setTimeout(()=>{
                    logo.classList.remove('active');
                    logo.classList.add('fade');
                },2000);
                            
                setTimeout(()=>{
                    intro.style.top = '-100vh';
                    body.classList.remove('stop-scrolling');
                },2300);
                            
                        
            })	
            
        }

    </script>
